{% extends 'base.html' %}
{% block title %}Моите оценки{% endblock %}

{% block extra_css %}
<style>
    .grade-badge { font-size: .8rem; }
    .grades-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 3px; }
    td.grades-cell { min-width: 260px; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-award"></i> Моите оценки
        {% if school_class %}<span class="badge bg-primary align-middle ms-2">{{ school_class }}</span>{% endif %}
    </h4>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Табло</a>
</div>

<form class="row g-2 mb-3" method="get">
    <div class="col-auto">
        <select name="subject" class="form-select form-select-sm">
            <option value="">— Всички предмети —</option>
            {% for s in subjects %}
            <option value="{{ s.pk }}" {% if selected_subject == s.pk|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Филтрирай</button>
    </div>
</form>

{% include 'partials/grades_by_subject.html' %}
{% endblock %}
