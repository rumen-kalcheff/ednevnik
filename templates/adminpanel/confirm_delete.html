{% extends 'base.html' %}
{% block title %}Потвърждение за изтриване{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h5 class="mt-3">Потвърждение за изтриване</h5>
                <p class="text-muted">Сигурни ли сте, че искате да изтриете <strong>{{ type }}</strong>:</p>
                <p class="fw-bold fs-5">{{ obj }}</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Да, изтрий
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Отказ
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
