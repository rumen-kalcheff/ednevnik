{% extends 'base.html' %}
{% block title %}{{ action }} клас{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-building"></i> {{ action }} клас</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Наименование на класа</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ obj.name|default:'' }}" placeholder="напр. 10А" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Класен ръководител</label>
                        <select name="homeroom_teacher" class="form-select">
                            <option value="">— Без класен ръководител —</option>
                            {% for t in teachers %}
                            <option value="{{ t.pk }}"
                                {% if obj.homeroom_teacher_id == t.pk %}selected{% endif %}>
                                {{ t.get_full_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ action }}
                        </button>
                        <a href="{% url 'class_list' %}" class="btn btn-secondary">Отказ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
