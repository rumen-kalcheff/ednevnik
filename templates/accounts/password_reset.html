{% extends 'base.html' %}
{% block title %}Забравена парола — EduNova{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-4">
                    <i class="bi bi-key text-primary"></i> Забравена парола
                </h5>
                <p class="text-muted small">Въведете имейл адреса, с който сте регистрирани. Ще получите линк за смяна на паролата.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Имейл адрес</label>
                        <input type="email" name="email" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-envelope"></i> Изпрати линк
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-muted small">Обратно към вход</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
