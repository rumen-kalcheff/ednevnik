{% extends 'base.html' %}
{% block title %}{{ action }} зала{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-door-open"></i> {{ action }} учебна зала</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Номер / наименование</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ obj.name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тип на залата</label>
                        <select name="room_type" class="form-select">
                            {% for value, label in room_types %}
                            <option value="{{ value }}"
                                {% if obj.room_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Капацитет</label>
                        <input type="number" name="capacity" min="1" class="form-control"
                               value="{{ obj.capacity|default:26 }}">
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                               {% if not obj or obj.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Активна</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ action }}
                        </button>
                        <a href="{% url 'room_list' %}" class="btn btn-secondary">Отказ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
