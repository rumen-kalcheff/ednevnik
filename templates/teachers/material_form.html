{% extends 'base.html' %}
{% block title %}Качване на материал{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-upload"></i> Качване на материал</h5></div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Заглавие</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Предмет</label>
                        <select name="subject" class="form-select" required>
                            <option value="">-- Избери --</option>
                            {% for s in subjects %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Клас</label>
                        <select name="school_class" class="form-select" required>
                            <option value="">-- Избери --</option>
                            {% for c in classes %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Файл</label>
                        <input type="file" name="file" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание <small class="text-muted">(незадължително)</small></label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> Качи</button>
                        <a href="{% url 'teacher_material_list' %}" class="btn btn-secondary">Отказ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
