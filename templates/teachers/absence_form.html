{% extends 'base.html' %}
{% block title %}Ново отсъствие{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-calendar-x"></i> Отбелязване на отсъствия</h5></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Дата</label>
                        <input type="date" id="date-input" name="date" class="form-control"
                               value="{{ initial_date|date:'Y-m-d' }}" max="{{ today|date:'Y-m-d' }}" required
                               data-initial-class="{{ initial_class_id }}" data-initial-subject="{{ initial_subject_id }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Клас</label>
                        <select id="class-select" class="form-select" required>
                            <option value="">-- Зарежда... --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Предмет</label>
                        <select name="subject" id="subject-select" class="form-select" required>
                            <option value="">-- Първо избери клас --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ученици <small class="text-muted">(може повече от един)</small></label>
                        <select name="students" id="student-select" class="form-select" multiple size="6" required>
                            <option value="">-- Първо избери клас --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Вид</label>
                        <select name="absence_type" class="form-select">
                            {% for val, label in absence_types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Запази</button>
                        <a href="{% url 'absence_list' %}" class="btn btn-secondary">Отказ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let pairs = [];
const dateInput = document.getElementById('date-input');
let pendingClass = dateInput.dataset.initialClass || '';
let pendingSubject = dateInput.dataset.initialSubject || '';

function updateSubjects(preselect) {
    const classId = document.getElementById('class-select').value;
    const subjectSelect = document.getElementById('subject-select');
    const previousSubject = preselect !== undefined ? preselect : subjectSelect.value;
    if (!classId) {
        subjectSelect.innerHTML = '<option value="">-- Първо избери клас --</option>';
        return;
    }
    subjectSelect.innerHTML = '<option value="">-- Избери предмет --</option>';
    pairs.filter(p => String(p.class_id) === classId).forEach(p => {
        subjectSelect.innerHTML += `<option value="${p.subject_id}">${p.subject_name}</option>`;
    });
    if ([...subjectSelect.options].some(o => o.value === previousSubject)) {
        subjectSelect.value = previousSubject;
    }
}

function updateStudents() {
    const classId = document.getElementById('class-select').value;
    const studentSelect = document.getElementById('student-select');
    if (!classId) {
        studentSelect.innerHTML = '<option value="">-- Първо избери клас --</option>';
        return;
    }
    studentSelect.innerHTML = '<option>Зарежда...</option>';
    fetch(`/teacher/api/students-by-class/?class_id=${classId}`)
        .then(r => r.json())
        .then(data => {
            studentSelect.innerHTML = '';
            data.forEach(s => {
                studentSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        });
}

function loadOptionsForDate(dateValue) {
    const classSelect = document.getElementById('class-select');
    const previousClass = pendingClass || classSelect.value;
    const subjectToSelect = pendingSubject;
    pendingClass = '';
    pendingSubject = '';
    fetch(`/teacher/api/class-subjects-by-date/?date=${dateValue}`)
        .then(r => r.json())
        .then(data => {
            pairs = data.pairs;
            classSelect.innerHTML = '<option value="">-- Избери клас --</option>';
            data.classes.forEach(c => {
                classSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
            if ([...classSelect.options].some(o => o.value === previousClass)) {
                classSelect.value = previousClass;
            }
            updateSubjects(subjectToSelect || undefined);
            updateStudents();
        });
}

dateInput.addEventListener('change', function() {
    loadOptionsForDate(this.value);
});
document.getElementById('class-select').addEventListener('change', function() {
    updateSubjects();
    updateStudents();
});

loadOptionsForDate(dateInput.value);
</script>
{% endblock %}
