{% extends 'base.html' %}
{% block title %}Моят профил — EduNova{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-person-circle"></i> Моят профил</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label text-muted small">Потребителско име</label>
                    <p class="fw-semibold mb-0">{{ user.username }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small">Пълно име</label>
                    <p class="fw-semibold mb-0">{{ user.get_full_name }}</p>
                </div>
                <hr>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Имейл за връзка</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ user.email }}" placeholder="example@mail.com">
                        <div class="form-text">Видим за ученици и родители в секция „Контакти учители".</div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Запази
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
